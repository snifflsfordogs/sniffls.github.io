<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #111110;
    --white: #faf9f7;
    --orange: #E8571A;
    --beige: #f0ece4;
    --gray: #8a8880;
    --border: rgba(17,17,16,0.1);
  }

  html, body {
    min-height: 100%;
    background: var(--beige);
    font-family: 'Montserrat', sans-serif;
    color: var(--black);
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100svh;
    padding: 0;
    margin: 0;
  }

  .card {
    background: var(--white);
    border-radius: 0;
    width: 100%;
    max-width: 100%;
    min-height: 100svh;
    overflow: hidden;
    box-shadow: none;
    animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @media (min-width: 480px) {
    body {
      padding: 2rem 1rem;
      background: var(--beige);
    }
    .card {
      border-radius: 24px;
      max-width: 420px;
      min-height: unset;
      box-shadow: 0 2px 0 rgba(0,0,0,0.06), 0 24px 64px rgba(0,0,0,0.10);
    }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .header {
    background: var(--black);
    padding: 0;
    position: relative;
    overflow: hidden;
    text-align: center;
    display: block;
  }

  .header::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 180px; height: 180px;
    border-radius: 50%;
    border: 40px solid rgba(232,87,26,0.15);
  }

  .header::after {
    content: '';
    position: absolute;
    bottom: -20px; left: 60px;
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 20px solid rgba(232,87,26,0.08);
  }

  .logo-img {
    width: 82%;
    height: auto;
    display: block;
    margin: -0.5rem auto 0.5rem;
    position: relative;
    z-index: 1;
  }

  .tagline {
    position: absolute;
    bottom: 1.2rem;
    left: 0; right: 0;
    font-size: 0.88rem;
    font-weight: 600;
    color: rgba(250,249,247,0.75);
    letter-spacing: 0.02em;
    z-index: 3;
    line-height: 1.5;
    padding: 0 2rem;
  }

  .paw {
    position: absolute;
    bottom: 1rem; right: 1rem;
    opacity: 0.15;
    z-index: 2;
  }
  .paw-sm {
    position: absolute;
    bottom: 1.5rem; left: 1rem;
    opacity: 0.08;
    z-index: 2;
    transform: rotate(-20deg);
  }

  .body {
    padding: 1.75rem 2rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 0.25rem 0;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.25rem;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--white);
    text-decoration: none;
    color: var(--black);
    transition: all 0.18s ease;
    cursor: pointer;
    animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .link-btn:nth-child(1) { animation-delay: 0.1s; }
  .link-btn:nth-child(2) { animation-delay: 0.15s; }
  .link-btn:nth-child(3) { animation-delay: 0.2s; }
  .link-btn:nth-child(4) { animation-delay: 0.25s; }

  .link-btn:hover {
    background: var(--black);
    color: var(--white);
    border-color: var(--black);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }

  .link-btn:hover .icon-wrap {
    background: rgba(255,255,255,0.15);
  }

  .link-btn:hover .arrow {
    opacity: 1;
    transform: translateX(0);
  }

  .link-btn.primary {
    background: var(--black);
    color: var(--white);
    border-color: var(--black);
  }

  .link-btn.primary:hover {
    background: #2a2a28;
    border-color: #2a2a28;
  }

  .link-btn.primary .icon-wrap {
    background: rgba(255,255,255,0.15);
    color: var(--white);
  }

  .link-btn.primary:hover .icon-wrap {
    background: rgba(255,255,255,0.25);
  }

  .icon-wrap {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--beige);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    transition: all 0.18s ease;
  }

  .btn-text {
    flex: 1;
  }

  .btn-label {
    font-size: 0.75rem;
    font-weight: 300;
    opacity: 0.5;
    display: block;
    margin-bottom: 1px;
  }

  .btn-value {
    font-size: 0.9rem;
    font-weight: 500;
  }

  .arrow {
    font-size: 1rem;
    opacity: 0;
    transform: translateX(-4px);
    transition: all 0.18s ease;
  }

  .footer {
    padding: 0 2rem 1.75rem;
    text-align: center;
    font-size: 0.72rem;
    color: var(--gray);
    font-weight: 300;
    letter-spacing: 0.04em;
  }
  .founders-block {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 0.85rem 1.25rem;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--white);
  }
  .founders-role {
    font-size: 0.72rem;
    font-weight: 300;
    color: var(--gray);
    letter-spacing: 0.04em;
  }
  .founders-names {
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--black);
  }
</style>
